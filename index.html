<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">  
  <title>Drum Machine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Drum Machine</h1>  
      <div class="controls">
        <button id="play-btn" type="button">Play Sequence</button>
        <button id="stop-btn" type="button">Stop</button>
        <button id="clear-btn" type="button">Clear</button>
      </div>
    </header>
    <section class="settings">  
      <div class="setting-group">
        <label for="tempo">Tempo: <span id="tempo-val">120</span> BPM</label>
        <input id="tempo" type="range" min="60" max="180" value="120">
      </div>
    </section>
    <section id="grid" class="grid"></section>
  </main>  
  <script src="script.js"></script>
</body>
</html>
